<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ترياق | لوحة تحكم الصيدلي - إدارة المخزون</title>

  <!-- Vendor CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <!-- Base & Component CSS -->
  <link rel="stylesheet" href="../../css/base/variables.css">
  <link rel="stylesheet" href="../../css/base/global.css">
  <link rel="stylesheet" href="../../css/components/navbar.css">
  <link rel="stylesheet" href="../../css/components/footer.css">
  <link rel="stylesheet" href="../../css/components/modal.css">

  <!-- Page Custom CSS -->
  <link rel="stylesheet" href="../../css/pages/pharmacist/dashboard.css">
  <link rel="stylesheet" href="../../css/pages/pharmacist/inventory.css">
</head>
<body>

  <!-- Reusable App Navbar -->
  <app-navbar></app-navbar>

  <div class="dashboard-container">
    <!-- Reusable Pharmacist Sidebar -->
    <pharmacist-sidebar></pharmacist-sidebar>

    <div class="overlay" id="overlay"></div>

    <!-- Main Content Area -->
    <main class="main-content">
      <!-- Search and Add Bar -->
      <div class="top-bar d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2">
        <div class="d-flex gap-2 align-items-center flex-wrap">
          <button class="add-btn btn btn-success font-bold" id="addMedBtn">
            <i class="fa-solid fa-plus me-1"></i> إضافة دواء للمخزون
          </button>
          <button class="btn btn-primary font-bold" id="bulkImportBtn" title="استيراد مئات الأدوية دفعة واحدة عبر ملف Excel أو CSV">
            <i class="fa-solid fa-file-import me-1"></i> استيراد شيت إكسل / CSV
          </button>
          <button class="btn btn-outline-secondary font-bold" id="exportInventoryBtn" title="تصدير مخزون الصيدلية الحالي كملف CSV">
            <i class="fa-solid fa-file-export me-1"></i> تصدير المخزون
          </button>
        </div>

        <div class="search flex-grow-1 position-relative" style="min-width: 260px;">
          <input type="text" id="inventorySearchInput" class="form-control" placeholder="ابحث في المخزون بالاسم أو المادة الفعالة...">
        </div>
      </div>

      <!-- Medicine List Cards Grid -->
      <div class="medicine-list" id="inventoryList">
        <!-- Dynamic content rendered by JS -->
      </div>

      <div class="add-new-card text-center p-3 border rounded mt-3 font-bold" id="bottomAddMedBtn">
        <i class="fa-solid fa-plus-circle me-1"></i> + إضافة دواء جديد للمخزون
      </div>
    </main>
  </div>

  <!-- Reusable App Footer -->
  <app-footer></app-footer>

  <!-- Reusable Cart Modal -->
  <app-cart-modal></app-cart-modal>

  <!-- Vendor Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Core & Component Scripts -->
  <script src="../../js/config.js"></script>
  <script src="../../js/core/toast.js"></script>
  <script src="../../js/core/validation.js"></script>
  <script src="../../js/core/api.js"></script>
  <script src="../../js/core/auth.js"></script>
  <script src="../../js/core/cart.js"></script>
  <script src="../../js/components/app-navbar.js"></script>
  <script src="../../js/components/pharmacist-sidebar.js"></script>
  <script src="../../js/components/app-footer.js"></script>
  <script src="../../js/components/app-cart-modal.js"></script>

  <!-- Page Script -->
  <script src="../../js/pages/pharmacist/inventory.js"></script>
</body>
</html>
