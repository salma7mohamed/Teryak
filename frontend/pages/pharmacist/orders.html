<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ترياق | لوحة تحكم الصيدلي - إدارة الطلبات</title>

  <!-- Vendor CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <!-- Base & Component CSS -->
  <link rel="stylesheet" href="../../css/base/variables.css">
  <link rel="stylesheet" href="../../css/base/global.css">
  <link rel="stylesheet" href="../../css/components/navbar.css">
  <link rel="stylesheet" href="../../css/components/footer.css">
  <link rel="stylesheet" href="../../css/components/modal.css">
  <link rel="stylesheet" href="../../css/components/validation.css">

  <!-- Page Custom CSS -->
  <link rel="stylesheet" href="../../css/pages/pharmacist/dashboard.css">
  <link rel="stylesheet" href="../../css/pages/pharmacist/orders.css">
</head>
<body>

  <!-- Reusable App Navbar -->
  <app-navbar></app-navbar>

  <div class="dashboard-container">
    <!-- Reusable Pharmacist Sidebar -->
    <pharmacist-sidebar></pharmacist-sidebar>

    <div class="overlay" id="overlay"></div>

    <!-- Main Content Area -->
    <main class="main-content">
      <div class="orders-page-wrapper">
        <!-- Page Header -->
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
          <div>
            <h2 class="font-bold text-dark mb-1">
              <i class="fa-solid fa-receipt text-success me-2"></i> إدارة طلبات المرضى
            </h2>
            <p class="text-muted mb-0" style="font-size: 14px;">متابعة وتجهيز طلبيات الأدوية الواردة لصيدليتك والتحكم في حالات الاستلام والتوصيل</p>
          </div>
          <div class="d-flex gap-2">
            <button type="button" class="btn btn-outline-success font-bold" id="btnRefreshOrders" title="تحديث قائمة الطلبات">
              <i class="fa-solid fa-arrows-rotate me-1"></i> تحديث فوري
            </button>
          </div>
        </div>

        <!-- KPI Quick Stats Row -->
        <div class="row g-3 mb-4" id="ordersKpiContainer">
          <div class="col-md-3 col-6">
            <div class="kpi-card total-orders">
              <div class="kpi-icon"><i class="fa-solid fa-boxes-packing"></i></div>
              <div class="kpi-info">
                <span class="kpi-label">إجمالي الطلبات</span>
                <h3 class="kpi-val" id="kpiTotalOrders">0</h3>
              </div>
            </div>
          </div>
          <div class="col-md-3 col-6">
            <div class="kpi-card pending-orders">
              <div class="kpi-icon"><i class="fa-solid fa-clock-rotate-left"></i></div>
              <div class="kpi-info">
                <span class="kpi-label">قيد الانتظار</span>
                <h3 class="kpi-val" id="kpiPendingOrders">0</h3>
              </div>
            </div>
          </div>
          <div class="col-md-3 col-6">
            <div class="kpi-card preparing-orders">
              <div class="kpi-icon"><i class="fa-solid fa-mortar-pestle"></i></div>
              <div class="kpi-info">
                <span class="kpi-label">قيد التجهيز</span>
                <h3 class="kpi-val" id="kpiPreparingOrders">0</h3>
              </div>
            </div>
          </div>
          <div class="col-md-3 col-6">
            <div class="kpi-card completed-orders">
              <div class="kpi-icon"><i class="fa-solid fa-circle-check"></i></div>
              <div class="kpi-info">
                <span class="kpi-label">مكتملة ومُسلّمة</span>
                <h3 class="kpi-val" id="kpiCompletedOrders">0</h3>
              </div>
            </div>
          </div>
        </div>

        <!-- Filter Tabs & Search Bar -->
        <div class="orders-filter-bar bg-white p-3 rounded-4 shadow-sm border mb-4">
          <div class="row g-3 align-items-center">
            <!-- Search Box -->
            <div class="col-lg-5 col-12">
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-magnifying-glass text-muted"></i></span>
                <input type="text" id="orderSearchInput" class="form-control border-start-0" placeholder="ابحث برقم الطلب، اسم المريض، الهاتف، أو الدواء...">
              </div>
            </div>

            <!-- Status Tabs -->
            <div class="col-lg-7 col-12">
              <div class="order-status-tabs d-flex flex-wrap gap-2" id="orderStatusTabs">
                <button type="button" class="tab-pill active" data-status="all">
                  الكل <span class="pill-count" id="countAll">0</span>
                </button>
                <button type="button" class="tab-pill" data-status="pending">
                  قيد الانتظار <span class="pill-count bg-warning" id="countPending">0</span>
                </button>
                <button type="button" class="tab-pill" data-status="preparing">
                  قيد التجهيز <span class="pill-count bg-info" id="countPreparing">0</span>
                </button>
                <button type="button" class="tab-pill" data-status="ready">
                  جاهز للاستلام <span class="pill-count bg-primary" id="countReady">0</span>
                </button>
                <button type="button" class="tab-pill" data-status="completed">
                  مكتمل <span class="pill-count bg-success" id="countCompleted">0</span>
                </button>
                <button type="button" class="tab-pill" data-status="cancelled">
                  ملغي <span class="pill-count bg-danger" id="countCancelled">0</span>
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- Orders Cards Container -->
        <div class="orders-list-wrapper" id="ordersListContainer">
          <!-- Dynamic Orders will be rendered here by JS -->
        </div>
      </div>
    </main>
  </div>

  <!-- Order Details & Invoice Modal -->
  <div class="modal fade" id="orderDetailsModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content border-0 rounded-4 shadow-lg overflow-hidden">
        <div class="modal-header bg-success text-white py-3 px-4">
          <div class="d-flex align-items-center gap-2">
            <i class="fa-solid fa-file-invoice fs-4"></i>
            <div>
              <h5 class="modal-title font-bold m-0" id="modalOrderTitle">تفاصيل الطلب</h5>
              <small class="text-white-50" id="modalOrderDate">--</small>
            </div>
          </div>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body p-4" id="modalOrderBody">
          <!-- Populated by JS -->
        </div>
        <div class="modal-footer bg-light py-2 px-4 justify-content-between">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">إغلاق</button>
          <button type="button" class="btn btn-success font-bold" id="btnPrintOrderInvoice">
            <i class="fa-solid fa-print me-1"></i> طباعة الفاتورة
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Reusable App Footer -->
  <app-footer></app-footer>

  <!-- Reusable Cart Modal -->
  <app-cart-modal></app-cart-modal>

  <!-- Vendor Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Core & Component Scripts -->
  <script src="../../js/config.js"></script>
  <script src="../../js/core/toast.js"></script>
  <script src="../../js/core/validation.js"></script>
  <script src="../../js/core/api.js"></script>
  <script src="../../js/core/auth.js"></script>
  <script src="../../js/core/cart.js"></script>
  <script src="../../js/components/app-navbar.js"></script>
  <script src="../../js/components/pharmacist-sidebar.js"></script>
  <script src="../../js/components/app-footer.js"></script>
  <script src="../../js/components/app-cart-modal.js"></script>

  <!-- Page Script -->
  <script src="../../js/pages/pharmacist/orders.js"></script>
</body>
</html>
