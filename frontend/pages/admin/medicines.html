<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ترياق | إدارة الأدوية والكتالوج المركزي</title>

  <!-- Vendor CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/js/all.min.js" defer></script>

  <!-- Base & Component CSS -->
  <link rel="stylesheet" href="../../css/base/variables.css">
  <link rel="stylesheet" href="../../css/base/global.css">
  <link rel="stylesheet" href="../../css/components/navbar.css">
  <link rel="stylesheet" href="../../css/components/footer.css">
  <link rel="stylesheet" href="../../css/components/modal.css">

  <!-- Page Custom CSS -->
  <link rel="stylesheet" href="../../css/pages/admin/admin-layout.css">
  <link rel="stylesheet" href="../../css/pages/admin/medicines.css">
</head>
<body>

  <!-- Reusable App Navbar -->
  <app-navbar></app-navbar>

  <div class="dashboard-container container-fluid py-4">
    <!-- Top Mobile Header -->
    <div class="d-flex justify-content-between align-items-center mb-3 d-md-none">
      <button class="btn btn-outline-primary" id="sidebarToggle">
        <i class="fa-solid fa-bars"></i>
      </button>
      <h5 class="mb-0 font-bold">إدارة الأدوية</h5>
      <span style="width: 40px;"></span>
    </div>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="main-wrapper d-flex gap-4">
      <!-- Reusable Admin Sidebar -->
      <admin-sidebar></admin-sidebar>

      <!-- Main Content -->
      <main class="dashboard-content flex-grow-1">
        <!-- Action Bar: Search Bar on Right, Buttons on Left -->
        <div class="action-bar d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2">
          <div class="d-flex gap-2 align-items-center flex-wrap">
            <button class="add-btn btn btn-primary font-bold d-flex align-items-center gap-2" id="openAddMedicineModalBtn">
              <i class="fa-solid fa-plus"></i>
              <span>إضافة دواء جديد</span>
            </button>
            <button class="btn btn-success font-bold d-flex align-items-center gap-2" id="openBulkImportModalBtn">
              <i class="fa-solid fa-file-import"></i>
              <span>استيراد كتالوج إكسل / CSV</span>
            </button>
            <button class="btn btn-outline-secondary font-bold d-flex align-items-center gap-2" id="exportMedicinesBtn">
              <i class="fa-solid fa-file-export"></i>
              <span>تصدير الكتالوج</span>
            </button>
          </div>

          <div class="search-box flex-grow-1 position-relative" style="min-width: 260px;">
            <input type="text" id="medicineSearchInput" placeholder="ابحث في الكتالوج بالاسم العربي أو الإنجليزي أو الفئة..." class="form-control">
            <span class="search-icon">
              <i class="fa-solid fa-magnifying-glass"></i>
            </span>
          </div>
        </div>

        <!-- Medicines Cards Container -->
        <div class="medicines-cards-container d-flex flex-column gap-3" id="medicinesList">
          <!-- Dynamic content loaded via JS -->
        </div>
      </main>
    </div>
  </div>

  <!-- Modal: Add New Medicine -->
  <div class="modal-backdrop" id="addMedicineModal" style="display: none;">
    <div class="modal-box">
      <div class="modal-header d-flex justify-content-between align-items-center">
        <h3 class="mb-0">إضافة دواء جديد للكتالوج الوطني</h3>
        <button type="button" class="close-modal-btn" id="closeAddMedModalBtn">&times;</button>
      </div>
      <form id="addMedicineForm" class="p-3">
        <div class="form-group mb-3">
          <label class="form-label font-bold">اسم الدواء بالعربية <span class="text-danger">*</span></label>
          <input type="text" id="newMedName" class="form-control" required placeholder="مثال: أسبرين بروتكت 100 مجم">
        </div>
        <div class="form-group mb-3">
          <label class="form-label font-bold">الاسم العلمي / الإنجليزي</label>
          <input type="text" id="newMedEngName" class="form-control" placeholder="مثال: Aspirin Protect 100mg">
        </div>
        <div class="row g-2 mb-3">
          <div class="col-6">
            <label class="form-label font-bold">التصنيف الدوائي</label>
            <select id="newMedCategory" class="form-select">
              <option value="مسكنات">مسكنات</option>
              <option value="مضادات حيوية">مضادات حيوية</option>
              <option value="فيتامينات">فيتامينات</option>
              <option value="أدوية قلب وسكر">أدوية قلب وسكر</option>
              <option value="مكملات غذائية">مكملات غذائية</option>
              <option value="جلدية وتجميل">جلدية وتجميل</option>
              <option value="أخرى">أخرى</option>
            </select>
          </div>
          <div class="col-6">
            <label class="form-label font-bold">السعر الافتراضي (ج.م)</label>
            <input type="number" id="newMedPrice" class="form-control" value="35.00" min="1" step="0.5">
          </div>
        </div>
        <div class="row g-2 mb-3">
          <div class="col-6">
            <label class="form-label font-bold">الشكل الصيدلي</label>
            <input type="text" id="newMedDosageForm" class="form-control" placeholder="أقراص / شراب / كبسول">
          </div>
          <div class="col-6">
            <label class="form-label font-bold">الحالة</label>
            <select id="newMedStatus" class="form-select">
              <option value="نشط">نشط</option>
              <option value="قيد المراجعة">قيد المراجعة</option>
            </select>
          </div>
        </div>
        <div class="modal-footer d-flex justify-content-end gap-2 mt-4">
          <button type="button" class="btn btn-secondary" id="cancelMedModalBtn">إلغاء</button>
          <button type="submit" class="btn btn-primary font-bold">حفظ الدواء بالكتالوج</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal: Bulk Import -->
  <div class="modal fade" id="adminBulkImportModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content" style="border-radius: 14px; overflow: hidden; border: none; box-shadow: 0 20px 40px rgba(0,0,0,0.15);">
        <div class="modal-header bg-success text-white py-3 px-4">
          <h5 class="modal-title font-bold"><i class="fa-solid fa-file-import me-2"></i> استيراد كتالوج أدوية مجمعة (Bulk Catalog Import)</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-4">
          <div class="alert alert-info py-2 px-3 mb-3 d-flex align-items-center justify-content-between">
            <div>
              <i class="fa-solid fa-circle-info me-2"></i> استيراد آلاف الأدوية إلى قاعدة البيانات المركزية بملف واحد.
            </div>
            <button type="button" class="btn btn-outline-primary btn-sm font-bold" id="adminDownloadTemplateBtn">
              <i class="fa-solid fa-download me-1"></i> تحميل قالب فارغ
            </button>
          </div>

          <div class="mb-3">
            <label class="form-label font-bold">1. رفع ملف CSV أو Excel:</label>
            <input type="file" id="adminCsvFileInput" class="form-control" accept=".csv, .txt">
          </div>

          <div class="mb-3">
            <label class="form-label font-bold">2. أو الصق أسطر CSV (الاسم العربي,الاسم الإنجليزي,الفئة,السعر):</label>
            <textarea id="adminCsvTextInput" class="form-control" rows="5" placeholder="الاسم العربي,الاسم الإنجليزي,الفئة,السعر
أوجمنتين 1 جم,Augmentin 1g,مضادات حيوية,110.00
بانادول جوينت,Panadol Joint,مسكنات,65.00
ديفارول إس فيتامين د,Devarol S,فيتامينات,28.50"></textarea>
          </div>

          <div class="d-flex justify-content-between align-items-center mt-4">
            <button type="button" class="btn btn-light" data-bs-dismiss="modal">إلغاء</button>
            <button type="button" class="btn btn-success px-4 font-bold" id="adminExecuteImportBtn">
              <i class="fa-solid fa-cloud-arrow-up me-1"></i> بدء الاستيراد للكتالوج
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Reusable App Footer -->
  <app-footer></app-footer>

  <!-- Reusable Cart Modal -->
  <app-cart-modal></app-cart-modal>

  <!-- Vendor Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Core & Component Scripts -->
  <script src="../../js/config.js"></script>
  <script src="../../js/core/toast.js"></script>
  <script src="../../js/core/validation.js"></script>
  <script src="../../js/core/api.js"></script>
  <script src="../../js/core/auth.js"></script>
  <script src="../../js/core/cart.js"></script>
  <script src="../../js/components/app-navbar.js"></script>
  <script src="../../js/components/admin-sidebar.js"></script>
  <script src="../../js/components/app-footer.js"></script>
  <script src="../../js/components/app-cart-modal.js"></script>

  <!-- Page Script -->
  <script src="../../js/pages/admin/medicines.js"></script>
</body>
</html>
