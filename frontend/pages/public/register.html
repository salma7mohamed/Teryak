<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تِرياق | إنشاء حساب جديد</title>
  <!-- Favicon / Brand Logo -->
  <link rel="icon" type="image/png" href="../../assets/images/logo.png">
  <link rel="apple-touch-icon" href="../../assets/images/logo.png">
  <meta name="description" content="انضم إلى منصة تِرياق الطبية كـ مريض أو صيدلي معتمد وابدأ فوراً.">

    <!-- Anti-flicker Theme Script: Executed synchronously before ANY CSS or DOM paint -->
  <script>
    (function(){try{var saved=localStorage.getItem('teryak_theme')||localStorage.getItem('theme');var prefersDark=window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches;var isDark=saved==='dark'||(!saved&&prefersDark);if(isDark){document.documentElement.setAttribute('data-theme','dark');document.documentElement.classList.add('dark-theme');document.documentElement.style.backgroundColor='#0b1120';document.documentElement.style.colorScheme='dark';}else{document.documentElement.setAttribute('data-theme','light');document.documentElement.classList.remove('dark-theme');document.documentElement.style.backgroundColor='#f8fafc';document.documentElement.style.colorScheme='light';}}catch(e){}})();
  </script>

  <!-- Typography: Cairo, Alexandria, Tajawal -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Alexandria:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  
  <!-- Vendor CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <!-- Base & Component CSS -->
  <link rel="stylesheet" href="../../css/base/variables.css">
  <link rel="stylesheet" href="../../css/base/global.css">
  <link rel="stylesheet" href="../../css/components/navbar.css">
  <link rel="stylesheet" href="../../css/components/components.css">
  <link rel="stylesheet" href="../../css/components/footer.css">
  <link rel="stylesheet" href="../../css/components/modal.css">
  <link rel="stylesheet" href="../../css/components/validation.css">

  <!-- Page Custom CSS -->
  <link rel="stylesheet" href="../../css/pages/public/login.css">
</head>
<body data-page="register">

  <!-- Reusable App Navbar -->
  <app-navbar></app-navbar>

  <div id="spa-content">
    <main class="wrap">
      <div class="auth">
        <!-- Compact Header Pitch -->
        <div class="auth-header">
          <div class="auth-badge-icon">
            <i class="fa-solid fa-user-plus"></i>
          </div>
          <h1>إنشاء حساب جديد</h1>
          <p>انضم إلى شبكة منصة تِرياق الطبية كـ مريض أو صيدلي معتمد.</p>
        </div>

        <!-- Ergonomic & Compact Register Card Form -->
        <form id="registerForm" class="card auth-box" novalidate>
          <!-- User Type Selection Tabs -->
          <div class="tabs" role="tablist">
            <button type="button" class="tab active on" data-type="مريض" id="tabPatient">
              <i class="fa-solid fa-user me-1"></i> مريض
            </button>
            <button type="button" class="tab" data-type="صيدلي" id="tabPharmacist">
              <i class="fa-solid fa-prescription-bottle-medical me-1"></i> صيدلي
            </button>
          </div>

          <!-- Row 1: Full Name & Phone Number (Side-by-side) -->
          <div class="form-row">
            <div class="form-group">
              <label class="lbl" for="fullName" id="nameLabel">الاسم بالكامل</label>
              <div class="input-wrap">
                <i class="fa-solid fa-user field-icon"></i>
                <input type="text" class="in has-icon" id="fullName" placeholder="مثال: أحمد محمد علي" required autocomplete="name">
              </div>
            </div>

            <div class="form-group">
              <label class="lbl" for="phone">رقم الهاتف</label>
              <div class="input-wrap">
                <i class="fa-solid fa-phone field-icon"></i>
                <input type="tel" class="in has-icon" id="phone" placeholder="01xxxxxxxxx" required autocomplete="tel">
              </div>
            </div>
          </div>

          <!-- Row 2: Pharmacist Fields (Side-by-side when active) -->
          <div class="form-row pharmacist-field" style="display: none;">
            <div class="form-group">
              <label class="lbl" for="pharmacyName">اسم الصيدلية التجاري</label>
              <div class="input-wrap">
                <i class="fa-solid fa-prescription-bottle-medical field-icon"></i>
                <input type="text" class="in has-icon" id="pharmacyName" placeholder="مثال: صيدلية الأمل">
              </div>
            </div>

            <div class="form-group">
              <label class="lbl" for="licenseNumber">رقم ترخيص الصيدلية</label>
              <div class="input-wrap">
                <i class="fa-solid fa-id-card field-icon"></i>
                <input type="text" class="in has-icon" id="licenseNumber" placeholder="مثال: 123456">
              </div>
            </div>
          </div>

          <!-- Row 3: Email (Full width) -->
          <div class="form-group">
            <label class="lbl" for="email">البريد الإلكتروني</label>
            <div class="input-wrap">
              <i class="fa-regular fa-envelope field-icon"></i>
              <input type="email" class="in has-icon" id="email" placeholder="name@example.com" required autocomplete="email">
            </div>
          </div>

          <!-- Row 4: Password & Confirm Password (Side-by-side) -->
          <div class="form-row">
            <div class="form-group">
              <label class="lbl" for="password">كلمة المرور</label>
              <div class="password-box input-wrap">
                <i class="fa-solid fa-lock field-icon"></i>
                <input id="password" type="password" class="in has-icon" placeholder="••••••••" required autocomplete="new-password">
                <button type="button" class="eye-btn" aria-label="عرض / إخفاء كلمة المرور" tabindex="-1">
                  <i class="fa-solid fa-eye"></i>
                </button>
              </div>
            </div>

            <div class="form-group">
              <label class="lbl" for="confirmPassword">تأكيد كلمة المرور</label>
              <div class="password-box input-wrap">
                <i class="fa-solid fa-lock field-icon"></i>
                <input id="confirmPassword" type="password" class="in has-icon" placeholder="••••••••" required autocomplete="new-password">
                <button type="button" class="eye-btn" aria-label="عرض / إخفاء كلمة المرور" tabindex="-1">
                  <i class="fa-solid fa-eye"></i>
                </button>
              </div>
            </div>
          </div>

          <!-- Terms Checkbox -->
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="termsCheck" required>
            <label class="form-check-label" for="termsCheck">
              أوافق على <a href="about.html#terms" class="text-success text-decoration-none font-bold">الشروط والأحكام</a> و<a href="about.html#privacy" class="text-success text-decoration-none font-bold">سياسة الخصوصية</a>
            </label>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="btn btn-brand w-100" style="margin-top:6px;">
            إنشاء الحساب
          </button>

          <!-- Divider -->
          <div class="or">أو</div>

          <!-- Google Auth Button -->
          <button type="button" class="google-btn w-100" id="SignWithG">
            <i class="fa-brands fa-google text-danger me-2"></i> التسجيل باستخدام Google
          </button>

          <!-- Switch to Login -->
          <p class="sw">
            لديك حساب بالفعل؟ <a href="login.html">تسجيل الدخول</a>
          </p>
        </form>
      </div>
    </main>

    <!-- Reusable App Footer -->
    <app-footer></app-footer>
  </div>

  <!-- Reusable Cart Modal -->
  <app-cart-modal></app-cart-modal>

  <!-- Vendor Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Core & Component Scripts -->
  <script src="../../js/config.js"></script>
  <script src="../../js/core/toast.js"></script>
  <script src="../../js/core/validation.js"></script>
  <script src="../../js/core/api.js"></script>
  <script src="../../js/core/auth.js"></script>
  <script src="../../js/core/cart.js"></script>
  <script src="../../js/components/app-navbar.js"></script>
  <script src="../../js/components/app-footer.js"></script>
  <script src="../../js/components/app-cart-modal.js"></script>
  <script src="../../js/core/spa-router.js"></script>

  <!-- Page Script -->
  <script src="../../js/pages/public/register.js"></script>
</body>
</html>
