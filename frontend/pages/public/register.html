<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ترياق | إنشاء حساب جديد</title>

  <!-- Vendor CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <!-- Base & Component CSS -->
  <link rel="stylesheet" href="../../css/base/variables.css">
  <link rel="stylesheet" href="../../css/base/global.css">
  <link rel="stylesheet" href="../../css/components/navbar.css">
  <link rel="stylesheet" href="../../css/components/footer.css">
  <link rel="stylesheet" href="../../css/components/modal.css">
  <link rel="stylesheet" href="../../css/components/validation.css">

  <!-- Page Custom CSS -->
  <link rel="stylesheet" href="../../css/pages/public/login.css">
</head>
<body>

  <!-- Reusable App Navbar -->
  <app-navbar></app-navbar>

  <main class="container my-5 pt-4">
    <section class="hero text-center mb-4">
      <h1>إنشاء حساب جديد</h1>
      <p class="text-muted">انضم إلى شبكة منصة ترياق الطبية</p>
    </section>

    <!-- Register Card -->
    <form id="registerForm" class="auth-card mx-auto" style="max-width: 520px;">
      <!-- User Type Selection Tabs -->
      <div class="tabs mb-4">
        <button type="button" class="tab active">مريض</button>
        <button type="button" class="tab">صيدلي</button>
      </div>

      <!-- Full Name -->
      <div class="form-group mb-3">
        <div class="input-box">
          <i class="fa-solid fa-user field-icon"></i>
          <input type="text" class="floating-input" id="fullName" placeholder=" " required>
          <label for="fullName" class="floating-label">الاسم بالكامل</label>
        </div>
      </div>

      <!-- Pharmacy Name (Only for Pharmacists) -->
      <div class="form-group pharmacist-field mb-3" style="display: none;">
        <div class="input-box">
          <i class="fa-solid fa-prescription-bottle-medical field-icon"></i>
          <input type="text" class="floating-input" id="pharmacyName" placeholder=" ">
          <label for="pharmacyName" class="floating-label">اسم الصيدلية التجاري</label>
        </div>
      </div>

      <!-- Email -->
      <div class="form-group mb-3">
        <div class="input-box">
          <i class="fa-regular fa-envelope field-icon"></i>
          <input type="email" class="floating-input" id="email" placeholder=" " required>
          <label for="email" class="floating-label">البريد الإلكتروني</label>
        </div>
      </div>

      <!-- Phone -->
      <div class="form-group mb-3">
        <div class="input-box">
          <i class="fa-solid fa-phone field-icon"></i>
          <input type="tel" class="floating-input" id="phone" placeholder=" " required>
          <label for="phone" class="floating-label">رقم الهاتف</label>
        </div>
      </div>

      <!-- License Number (Only for Pharmacists) -->
      <div class="form-group pharmacist-field mb-3" style="display: none;">
        <div class="input-box">
          <i class="fa-solid fa-id-card field-icon"></i>
          <input type="text" class="floating-input" id="licenseNumber" placeholder=" ">
          <label for="licenseNumber" class="floating-label">رقم ترخيص مزاولة المهنة / الصيدلية</label>
        </div>
      </div>

      <!-- Password -->
      <div class="form-group mb-3">
        <div class="input-box password-box">
          <i class="fa-solid fa-lock field-icon"></i>
          <input id="password" type="password" class="floating-input" placeholder=" " required>
          <label for="password" class="floating-label">كلمة المرور</label>
          <button type="button" class="eye-btn" aria-label="عرض / إخفاء كلمة المرور" tabindex="-1">
            <i class="fa-solid fa-eye"></i>
          </button>
        </div>
      </div>

      <!-- Confirm Password -->
      <div class="form-group mb-3">
        <div class="input-box password-box">
          <i class="fa-solid fa-lock field-icon"></i>
          <input id="confirmPassword" type="password" class="floating-input" placeholder=" " required>
          <label for="confirmPassword" class="floating-label">تأكيد كلمة المرور</label>
          <button type="button" class="eye-btn" aria-label="عرض / إخفاء كلمة المرور" tabindex="-1">
            <i class="fa-solid fa-eye"></i>
          </button>
        </div>
      </div>

      <!-- Terms Checkbox -->
      <div class="form-check mb-3 mt-1">
        <input class="form-check-input" type="checkbox" id="termsCheck" required>
        <label class="form-check-label text-muted" for="termsCheck">
          أوافق على <a href="#" class="text-success">الشروط والأحكام</a> وسياسة الخصوصية
        </label>
      </div>

      <button type="submit" class="btn btn-success w-100 py-2 font-bold mb-3" style="background-color: var(--primary-color);">
        إنشاء الحساب
      </button>

      <button type="button" class="google-btn w-100" id="SignWithG">
        <i class="fa-brands fa-google text-danger me-2"></i> التسجيل باستخدام Google
      </button>

      <div class="text-center mt-4 pt-3 border-top">
        <span class="text-muted">لديك حساب بالفعل؟</span>
        <a href="login.html" class="text-success font-bold me-1">تسجيل الدخول</a>
      </div>
    </form>
  </main>

  <!-- Reusable App Footer -->
  <app-footer></app-footer>

  <!-- Reusable Cart Modal -->
  <app-cart-modal></app-cart-modal>

  <!-- Vendor Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Core & Component Scripts -->
  <script src="../../js/config.js"></script>
  <script src="../../js/core/toast.js"></script>
  <script src="../../js/core/validation.js"></script>
  <script src="../../js/core/api.js"></script>
  <script src="../../js/core/auth.js"></script>
  <script src="../../js/core/cart.js"></script>
  <script src="../../js/components/app-navbar.js"></script>
  <script src="../../js/components/app-footer.js"></script>
  <script src="../../js/components/app-cart-modal.js"></script>

  <!-- Page Script -->
  <script src="../../js/pages/public/register.js"></script>
</body>
</html>
