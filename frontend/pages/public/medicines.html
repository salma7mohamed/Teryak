<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ترياق | دليل الأدوية - تصفح وقارن الأسعار</title>

  <!-- Vendor CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/js/all.min.js" defer></script>

  <!-- Base & Component CSS -->
  <link rel="stylesheet" href="../../css/base/variables.css">
  <link rel="stylesheet" href="../../css/base/global.css">
  <link rel="stylesheet" href="../../css/components/navbar.css">
  <link rel="stylesheet" href="../../css/components/footer.css">
  <link rel="stylesheet" href="../../css/components/modal.css">

  <!-- Page Custom CSS -->
  <link rel="stylesheet" href="../../css/pages/public/medicines.css">
</head>
<body>

  <!-- Reusable App Navbar -->
  <app-navbar></app-navbar>

  <main class="container">
    <!-- Page Header & Filter Section -->
    <div class="top">
      <div class="catalog-header-wrap">
        <div>
          <h2>دليل الأدوية والمستحضرات</h2>
          <p>تصفح قاعدة بيانات الأدوية المتاحة وقارن الأسعار وأماكن التوفر في أقرب صيدلية لك</p>
        </div>
      </div>
      
      <!-- Main Search & Sort Toolbar -->
      <div class="toolbar-card">
        <div class="search-box-wrap">
          <i class="fa-solid fa-magnifying-glass search-icon"></i>
          <input type="text" placeholder="ابحث بالاسم التجاري، المادة الفعالة، أو الاستخدام..." id="searchInput" autocomplete="off">
          <button type="button" id="clearSearchBtn" class="clear-search-btn hide" aria-label="مسح البحث">&times;</button>
        </div>
        
        <div class="toolbar-actions">
          <div class="sort-wrap">
            <i class="fa-solid fa-arrow-down-short-wide sort-icon"></i>
            <select id="sortSelect" aria-label="ترتيب النتائج">
              <option value="default">الترتيب الافتراضي</option>
              <option value="priceLow">السعر: من الأقل للأعلى</option>
              <option value="priceHigh">السعر: من الأعلى للأقل</option>
              <option value="rating">الأعلى تقييماً ★</option>
              <option value="availability">الأكثر توفراً في الصيدليات</option>
              <option value="name">الاسم أبجدياً (أ - ي)</option>
            </select>
          </div>

          <button type="button" id="filterBtn" class="filter-toggle-btn" aria-expanded="false">
            <i class="fa-solid fa-sliders"></i>
            <span>الفلاتر المتقدمة</span>
            <span id="activeFilterBadge" class="filter-badge hide">0</span>
            <i id="arrow" class="fa-solid fa-chevron-down ms-1"></i>
          </button>
        </div>
      </div>

      <!-- Quick Category Pills (Horizontal scrolling/flex) -->
      <div class="quick-categories-bar" id="quickCategoriesBar">
        <button class="cat-pill active" data-category="all">
          <i class="fa-solid fa-border-all me-1"></i> جميع الأدوية
        </button>
        <button class="cat-pill" data-category="مسكنات">
          <i class="fa-solid fa-pills me-1"></i> مسكنات وسيولة
        </button>
        <button class="cat-pill" data-category="مضادات حيوية">
          <i class="fa-solid fa-shield-virus me-1"></i> مضادات حيوية
        </button>
        <button class="cat-pill" data-category="فيتامينات">
          <i class="fa-solid fa-capsules me-1"></i> فيتامينات
        </button>
        <button class="cat-pill" data-category="مكملات غذائية">
          <i class="fa-solid fa-heart-pulse me-1"></i> مكملات غذائية
        </button>
        <button class="cat-pill" data-category="نزلات برد">
          <i class="fa-solid fa-snowflake me-1"></i> نزلات البرد
        </button>
        <button class="cat-pill" data-category="هضمي">
          <i class="fa-solid fa-shield-heart me-1"></i> جهاز هضمي
        </button>
      </div>

      <!-- Advanced Collapsible Filter Drawer -->
      <div id="filter" class="advanced-filter-drawer">
        <div class="filter-grid">
          <!-- Availability Filter Section -->
          <div class="filter-section">
            <label class="filter-section-title"><i class="fa-solid fa-boxes-stacked me-1"></i> حالة التوفر في الصيدليات</label>
            <div class="filter-pills-group" id="statusFilterGroup">
              <button type="button" class="filter-pill active" data-filter="all">الكل</button>
              <button type="button" class="filter-pill" data-filter="available"><i class="fa-solid fa-circle-check text-success me-1"></i> متوفر فوراً</button>
              <button type="button" class="filter-pill" data-filter="limited"><i class="fa-solid fa-circle-exclamation text-warning me-1"></i> كمية محدودة</button>
              <button type="button" class="filter-pill" data-filter="unavailable"><i class="fa-solid fa-circle-xmark text-danger me-1"></i> غير متوفر</button>
            </div>
          </div>

          <!-- Price Range Filter Section -->
          <div class="filter-section">
            <label class="filter-section-title"><i class="fa-solid fa-tag me-1"></i> نطاق السعر (ج.م)</label>
            <div class="filter-pills-group" id="priceFilterGroup">
              <button type="button" class="filter-pill active" data-price-range="all">جميع الأسعار</button>
              <button type="button" class="filter-pill" data-price-range="under30">أقل من 30 ج.م</button>
              <button type="button" class="filter-pill" data-price-range="30to60">30 - 60 ج.م</button>
              <button type="button" class="filter-pill" data-price-range="over60">أكثر من 60 ج.م</button>
            </div>
          </div>
        </div>

        <div class="filter-drawer-footer">
          <button type="button" id="resetFiltersBtn" class="btn-reset-filters">
            <i class="fa-solid fa-rotate-left me-1"></i> إعادة تعيين كافة الفلاتر
          </button>
        </div>
      </div>

      <!-- Results Info & Active Filter Chips Bar -->
      <div class="results-meta-bar">
        <div class="results-count-text">
          <i class="fa-solid fa-list-check me-1 text-success"></i>
          عرض <strong id="resultsCount">13</strong> من أصل <span id="totalCount">13</span> أدوية
        </div>
        <div class="active-chips-container" id="activeChipsContainer"></div>
      </div>
    </div>

    <!-- Medicine Cards Grid (Populated Dynamically via medicines.js) -->
    <div class="row cards-row g-4 my-3" id="medicinesGrid">
      <div class="col-12 text-center py-5">
        <i class="fa-solid fa-circle-notch fa-spin text-success fs-1 mb-3"></i>
        <p class="text-muted font-bold">جاري تحميل وتحديث قائمة الأدوية المتوفرة...</p>
      </div>
    </div>

    <!-- Pagination Controls (1, 2, 3...) -->
    <div id="paginationNav" class="pagination-container hide">
      <button type="button" class="pagination-btn" id="prevPageBtn" aria-label="الصفحة السابقة">
        <i class="fa-solid fa-chevron-right me-1"></i> السابق
      </button>
      <div id="pageNumbersContainer" class="d-flex gap-1 align-items-center"></div>
      <button type="button" class="pagination-btn" id="nextPageBtn" aria-label="الصفحة التالية">
        التالي <i class="fa-solid fa-chevron-left ms-1"></i>
      </button>
    </div>
    <div id="paginationInfo" class="pagination-info hide"></div>

    <!-- Empty State (Shown when no matching medicines found) -->
    <div id="noResultsState" class="empty-results-box hide">
      <div class="empty-icon-wrap">
        <i class="fa-solid fa-magnifying-glass-chart"></i>
      </div>
      <h3 class="empty-title">لم يتم العثور على أدوية مطابقة</h3>
      <p class="empty-desc">جرب تعديل مصطلحات البحث أو إزالة بعض الفلاتر المحددة لعرض المزيد من الأدوية.</p>
      <button type="button" class="btn btn-success btn-reset-all" id="emptyResetBtn">
        <i class="fa-solid fa-rotate-left me-1"></i> إعادة ضبط وعرض كافة الأدوية
      </button>
    </div>
  </main>

  <!-- Reusable App Footer -->
  <app-footer></app-footer>

  <!-- Reusable Cart Modal -->
  <app-cart-modal></app-cart-modal>

  <!-- Vendor Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Core & Component Scripts -->
  <script src="../../js/config.js"></script>
  <script src="../../js/core/toast.js"></script>
  <script src="../../js/core/validation.js"></script>
  <script src="../../js/core/api.js"></script>
  <script src="../../js/core/auth.js"></script>
  <script src="../../js/core/cart.js"></script>
  <script src="../../js/components/app-navbar.js"></script>
  <script src="../../js/components/app-footer.js"></script>
  <script src="../../js/components/app-cart-modal.js"></script>

  <!-- Page Script -->
  <script src="../../js/pages/public/medicines.js"></script>
</body>
</html>
